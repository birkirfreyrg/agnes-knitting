name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Change to 'master' if your default branch is 'master'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build
        working-directory: ./frontend
        env:
          VITE_STRAPI_URL: ${{ secrets.VITE_STRAPI_URL }}
          VITE_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.VITE_INSTAGRAM_ACCESS_TOKEN }}
          VITE_INSTAGRAM_USER_ID: ${{ secrets.VITE_INSTAGRAM_USER_ID }}
        run: npm run build

      - name: Verify build output
        working-directory: ./frontend
        run: |
          echo "Checking build output..."
          ls -la dist/
          echo "---"
          echo "Files in dist/:"
          find dist/ -type f | head -20
          echo "---"
          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: index.html not found in dist/"
            exit 1
          fi
          echo "✓ index.html found"
          
          # Ensure CNAME is in dist (Vite should copy it from public/, but verify)
          if [ ! -f "dist/CNAME" ]; then
            echo "WARNING: CNAME not found in dist/, copying from public/"
            if [ -f "public/CNAME" ]; then
              cp public/CNAME dist/CNAME
              echo "✓ CNAME copied to dist/"
            else
              echo "ERROR: CNAME not found in public/ either!"
              exit 1
            fi
          else
            echo "✓ CNAME found in dist/"
          fi
          
          # Ensure 404.html is in dist
          if [ ! -f "dist/404.html" ]; then
            echo "WARNING: 404.html not found in dist/, copying from public/"
            if [ -f "public/404.html" ]; then
              cp public/404.html dist/404.html
              echo "✓ 404.html copied to dist/"
            fi
          else
            echo "✓ 404.html found in dist/"
          fi
          
          echo "Build verification complete"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: List artifact contents
        working-directory: ./frontend
        run: |
          echo "Final artifact contents (what will be uploaded):"
          echo "=========================================="
          find dist/ -type f -o -type d | sort
          echo "=========================================="
          echo "Root level files in dist/:"
          ls -la dist/ | head -10

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

